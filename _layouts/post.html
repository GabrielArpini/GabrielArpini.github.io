---
---
<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/homepage/reading.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/assets/homepage/reading.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% if page.math %}
    {% include origin-type.html %}
    <script defer src="{{ '/assets/js/data/mathjax.js' | relative_url }}"></script>
    <script defer id="MathJax-script" src="{{ site.data.origin[type].mathjax.js | relative_url }}"></script>
  {% endif %}
</head>
<body>
  <header class="masthead" id="top" tabindex="-1">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav aria-label="Blog">
      <a class="return-button arrow-control" href="{{ '/#writing' | relative_url }}" aria-label="Return to Writing"><span class="arrow-icon" aria-hidden="true"></span></a>
    </nav>
  </header>
  <main>
    <article class="article" aria-labelledby="article-title">
      <header class="lede">
        <div class="lede-inner">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %b %Y' }}</time>
          <h1 id="article-title">{{ page.title | escape }}</h1>
        </div>
        <div class="spectrum" aria-hidden="true"></div>
      </header>
      <div class="reading-layout">
        {% if site.toc and page.toc %}
          <nav class="toc" aria-labelledby="toc-title" hidden>
            <h2 id="toc-title">Contents</h2>
            <ol></ol>
          </nav>
        {% endif %}
        <div class="essay">
          {{ content
            | replace: '<div class="highlight"><pre class="highlight"><code', '<div class="highlight"><code'
            | replace: '</code></pre></div>', '</code></div>'
          }}
        </div>
      </div>
    </article>
  </main>
  <a class="back-to-top arrow-control" href="#top" aria-label="Back to top" hidden><span class="arrow-icon" aria-hidden="true"></span></a>
</body>
</html>
